<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="2;url=https://newyik.github.io/home/" />
    <title>小家控 · 正在跳转</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8f3ec;
        color: #403b34;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 36px 28px;
        border: 1px solid #e6dfd2;
        border-radius: 24px;
        background: #fffdf8;
        text-align: center;
        box-shadow: 0 18px 50px rgba(80, 64, 45, .08);
      }
      .mark {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        margin: 0 auto 18px;
        border-radius: 15px;
        background: #cf6547;
        color: #fff;
        font-size: 24px;
      }
      h1 { margin: 0 0 10px; font-size: 24px; letter-spacing: -.03em; }
      p { margin: 0; color: #7d7469; font-size: 14px; line-height: 1.8; }
      a { display: inline-block; margin-top: 20px; color: #a94b32; font-weight: 650; text-decoration: none; }
      small { display: block; margin-top: 16px; color: #aa9b8c; font-size: 11px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">⌂</div>
      <h1>小家控搬家了</h1>
      <p>新地址更短：<br /><strong>newyik.github.io/home</strong></p>
      <a id="continue" href="https://newyik.github.io/home/">如果没有自动跳转，点这里</a>
      <small>正在打开你们的小家…</small>
    </main>
    <script>
      (function () {
        var target = 'https://newyik.github.io/home/' + window.location.search + window.location.hash;
        var link = document.getElementById('continue');
        if (link) link.href = target;

        var redirected = false;
        function go() {
          if (redirected) return;
          redirected = true;
          window.location.replace(target);
        }

        var cleanup = Promise.resolve();
        if ('serviceWorker' in navigator) {
          cleanup = navigator.serviceWorker.getRegistrations()
            .then(function (registrations) {
              return Promise.all(registrations.map(function (registration) {
                return registration.unregister();
              }));
            })
            .catch(function () {});
        }

        cleanup.then(function () {
          if (window.caches && caches.keys) {
            return caches.keys()
              .then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key); }));
              })
              .catch(function () {});
          }
        }).then(go, go);

        window.setTimeout(go, 1200);
      }());
    </script>
  </body>
</html>
